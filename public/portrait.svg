<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="#090d16"/>
  <circle cx="250" cy="240" r="210" fill="url(#bgGlow)"/>

  <!-- Subtle Code Grid Lines in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="60" y1="120" x2="440" y2="120"/>
    <line x1="60" y1="200" x2="440" y2="200"/>
    <line x1="60" y1="280" x2="440" y2="280"/>
    <line x1="60" y1="360" x2="440" y2="360"/>
    <line x1="140" y1="60" x2="140" y2="440"/>
    <line x1="250" y1="60" x2="250" y2="440"/>
    <line x1="360" y1="60" x2="360" y2="440"/>
  </g>

  <!-- Developer Silhouette -->
  <!-- Shoulders / Torso / Hoodie -->
  <path d="M120 440 C120 350, 160 320, 250 320 C340 320, 380 350, 380 440 Z" fill="url(#bodyGrad)" stroke="url(#cyberGrad)" stroke-width="2"/>
  <path d="M210 320 L250 380 L290 320 Z" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>

  <!-- Neck -->
  <rect x="225" y="250" width="50" height="75" rx="10" fill="#1e293b"/>

  <!-- Head / Face -->
  <ellipse cx="250" cy="200" rx="70" ry="85" fill="#1e293b" stroke="url(#cyberGrad)" stroke-width="2"/>

  <!-- Modern Hair Silhouette -->
  <path d="M180 180 C180 120, 220 110, 260 110 C310 110, 325 140, 325 175 C310 160, 290 155, 270 155 C230 155, 200 170, 180 180 Z" fill="url(#cyberGrad)"/>

  <!-- Modern Tech Eyewear / Glasses with Cyber Accent -->
  <rect x="195" y="185" width="45" height="24" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="260" y="185" width="45" height="24" rx="6" fill="#090d16" stroke="#ec4899" stroke-width="2.5"/>
  <line x1="240" y1="197" x2="260" y2="197" stroke="#a855f7" stroke-width="3"/>
  <line x1="180" y1="197" x2="195" y2="197" stroke="#38bdf8" stroke-width="2"/>
  <line x1="305" y1="197" x2="320" y2="197" stroke="#ec4899" stroke-width="2"/>

  <!-- Tech Headphones -->
  <path d="M170 150 C170 110, 210 80, 250 80 C290 80, 330 110, 330 150" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <rect x="165" y="165" width="18" height="50" rx="8" fill="#ec4899" opacity="0.9"/>
  <rect x="317" y="165" width="18" height="50" rx="8" fill="#38bdf8" opacity="0.9"/>

  <!-- Coding Prompt & Brackets Badge -->
  <g transform="translate(180, 410)">
    <rect width="140" height="36" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="70" y="23" text-anchor="middle" font-family="Courier, monospace" font-weight="700" font-size="14" fill="#38bdf8">&lt;Developer /&gt;</text>
  </g>
</svg>
